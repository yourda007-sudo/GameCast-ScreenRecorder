name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and patch Gradle plugins
        run: |
          unzip -o *.zip
          sed -i 's/id = "org.jetbrains.kotlin", name = "kotlin-android"/id = "org.jetbrains.kotlin.android"/g' GameCastScreenRecorder/gradle/libs.versions.toml
          sed -i 's/id = "org.jetbrains.kotlin", name = "kotlin-parcelize"/id = "org.jetbrains.kotlin.plugin.parcelize"/g' GameCastScreenRecorder/gradle/libs.versions.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build Debug APK
        working-directory: GameCastScreenRecorder
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GameCastScreenRecorder-debug-apk
          path: GameCastScreenRecorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
